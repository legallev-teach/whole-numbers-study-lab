<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whole Numbers Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&family=Patrick+Hand&display=swap">
<style>
/* Layout: a sea-blue header band, then one calm column of topic cards; practice opens as one question card at a time. */
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#152A38; --muted:#526676; --line:#D3DFE6;
  --band:#0C3B52; --band-ink:#F4FAFC; --band-muted:#A8C8D6;
  --accent:#F0A020; --accent-ink:#2A1A00; --sea:#0F6E8C;
  --good:#1B7A4B; --good-bg:#E3F3E9; --bad:#AE3832; --bad-bg:#FBE8E6; --note-bg:#EAF2F7;
  --t1:#DCEFF6; --t1-ink:#0E5470; --t2:#FDEACB; --t2-ink:#7A4A00; --t3:#FADFE4; --t3-ink:#8C2237; --t4:#DFF1E2; --t4-ink:#215F39;
  --paper:#FFFEF8; --rule:#C9DCEB; --margin:#E59A9A; --teach:#5B3E8F; --teach-bg:#EFE9F8;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1820; --surface:#12242F; --ink:#E6EFF3; --muted:#9DB1BD; --line:#24394A;
    --band:#08283A; --band-ink:#EAF5F9; --band-muted:#8FB4C5;
    --accent:#F4B13E; --accent-ink:#241500; --sea:#62BCDA;
    --good:#5DCB8F; --good-bg:#11301F; --bad:#F28B81; --bad-bg:#3A1B19; --note-bg:#152F3D;
    --t1:#123848; --t1-ink:#9DD8EC; --t2:#3A2A0C; --t2-ink:#F6CB7A; --t3:#3C1A23; --t3-ink:#F3A6B6; --t4:#153523; --t4-ink:#9EDCB3;
    --paper:#16262F; --rule:#27445A; --margin:#8A4A4A; --teach:#C7B2F0; --teach-bg:#251C38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1820; --surface:#12242F; --ink:#E6EFF3; --muted:#9DB1BD; --line:#24394A;
  --band:#08283A; --band-ink:#EAF5F9; --band-muted:#8FB4C5;
  --accent:#F4B13E; --accent-ink:#241500; --sea:#62BCDA;
  --good:#5DCB8F; --good-bg:#11301F; --bad:#F28B81; --bad-bg:#3A1B19; --note-bg:#152F3D;
  --t1:#123848; --t1-ink:#9DD8EC; --t2:#3A2A0C; --t2-ink:#F6CB7A; --t3:#3C1A23; --t3-ink:#F3A6B6; --t4:#153523; --t4-ink:#9EDCB3;
  --paper:#16262F; --rule:#27445A; --margin:#8A4A4A; --teach:#C7B2F0; --teach-bg:#251C38;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
b{font-weight:600}
button{font:inherit;color:inherit}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.col{max-width:720px;margin:0 auto}

/* header band */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;opacity:.35;
  background:repeating-linear-gradient(90deg,var(--band-muted) 0 2px,transparent 2px 24px),
             repeating-linear-gradient(90deg,var(--band-muted) 0 2px,transparent 2px 120px);
  background-size:auto 7px, auto 14px;background-repeat:repeat-x;background-position:0 100%,0 100%}
.band .col{padding-block:28px 34px;display:grid;gap:10px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:500}
.band h1{font-size:clamp(2rem,7vw,2.9rem);font-weight:800;letter-spacing:-.01em;user-select:none;-webkit-user-select:none}
.band h1 span{color:var(--accent)}
.band p.lede{max-width:56ch;color:var(--band-ink);opacity:.92}

main .col{padding-block:22px 40px;display:grid;gap:18px}

.howto{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.howto h2{font-size:1.15rem}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:4px}

.section-label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mixed{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;text-align:left;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:18px;cursor:pointer}
.mixed .sym{grid-row:span 2;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.35);font-family:var(--font-display);font-weight:800;font-size:1.35rem}
.mixed h3{font-size:1.3rem}
.mixed p{font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card:hover{border-color:var(--sea)}
.card .sym{grid-row:span 3;min-width:54px;height:54px;padding:0 8px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.tint1 .sym,.tint1 .ticon{background:var(--t1);color:var(--t1-ink)} .tint2 .sym,.tint2 .ticon{background:var(--t2);color:var(--t2-ink)}
.tint3 .sym,.tint3 .ticon{background:var(--t3);color:var(--t3-ink)} .tint4 .sym,.tint4 .ticon{background:var(--t4);color:var(--t4-ink)}
.card h3{font-size:1.1rem}
.card p{font-size:.9rem;color:var(--muted)}
.best{font-size:.8rem;font-weight:600;color:var(--good)}
.progress-btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;cursor:pointer}
.progress-btn .mini-seal{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.motto{text-align:center;color:var(--muted);font-size:.9rem;padding-top:6px}
.motto i{font-family:var(--font-display);font-style:normal;font-weight:600;color:var(--ink)}

/* practice screen */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);font-size:.95rem}
.back:hover{border-color:var(--sea)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.now{background:var(--sea)} .dot.ok{background:var(--good)} .dot.miss{background:var(--accent)}
.qhead{display:grid;gap:4px}
.qhead .count{font-size:.85rem;color:var(--muted);font-weight:500}
.qhead h2{font-size:1.5rem}
details.remind{background:var(--note-bg);border-radius:12px;padding:10px 14px;min-width:0}
details.remind summary{cursor:pointer;font-weight:600;color:var(--sea)}
.remind-body{padding-top:10px;display:grid;gap:10px;min-width:0}
.example{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.example>b:first-child,.ex-title{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sea);font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px;min-width:0}
.prompt{display:grid;gap:8px;min-width:0}
.big{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,8vw,2.5rem);letter-spacing:.02em;color:var(--sea)}
.ix sup{font-size:.68em;font-weight:700;position:relative;top:-.1em;margin-left:.05em;color:var(--accent)}
.big .ix sup{font-size:.5em;top:-.15em}
.step{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px;min-width:0}
.step:first-child{border-top:0;padding-top:0}
.step-q{font-weight:500}
.answer-row{display:flex;gap:10px;flex-wrap:wrap}
.answer-row input,.field input,.field select{flex:1 1 160px;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:10px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.answer-row input:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--sea)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--note-bg);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--sea)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;font-size:1.1rem;font-weight:600;cursor:pointer;text-align:center}
.tile[aria-pressed="true"]{background:var(--t1);border-color:var(--sea);color:var(--t1-ink)}
.tile.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.tile.missed{border-color:var(--good);border-style:dashed}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
/* circling: the chosen numbers get a ring, like a pen circle in the exercise book */
.crow{display:grid;gap:6px}
.crow-label{font-weight:600;font-size:.95rem}
.crow .tile{border-radius:999px}
.crow .tile[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.crow .tile.right{box-shadow:0 0 0 2px var(--good)}
.circ{display:inline-grid;place-items:center;min-width:1.9em;padding:0 .3em;border:2px solid var(--accent);border-radius:999px;font-weight:600;line-height:1.5}
.listline{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.listline .lbl{font-weight:600;margin-right:4px}
.listline .cm{margin-left:-5px}
.fb{border-radius:12px;padding:12px 14px}
.fb>p,.fb>div,.fb>ul{margin-top:8px}
.fb.good{background:var(--good-bg)} .fb.good>b:first-child{color:var(--good)}
.fb.bad{background:var(--bad-bg)} .fb.bad>b:first-child{color:var(--bad)}
.fb.note{background:var(--note-bg)}
.fb .again{font-weight:600}
.fb .reveal{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:8px}
.fb ul{margin-bottom:0;padding-left:1.2em}
.next-row{display:flex;justify-content:flex-end}

/* place value chart */
.pv{overflow-x:auto}
.pv table{border-collapse:collapse;margin-top:4px}
.pv th,.pv td{border:1px solid var(--line);padding:4px 8px;text-align:center;min-width:2.4em}
.pv th{font-size:.75rem;color:var(--muted);font-weight:600}
.pv td{font-weight:600;font-size:1.1rem;background:var(--surface)}
.pv td.hit{background:var(--accent);color:var(--accent-ink)}
.small{font-size:.85rem;color:var(--muted)}

/* number line */
.nline{position:relative;height:58px;margin:4px 14px 0}
.nline .axis{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--ink)}
.nline .tick{position:absolute;top:15px;width:2px;height:16px;background:var(--ink)}
.nline .lab{position:absolute;top:36px;transform:translateX(-50%);font-size:.8rem;white-space:nowrap}
.nline .mid{background:var(--muted)} .nline .lab.midl{color:var(--muted)}
.nline .mark{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:var(--accent);transform:translateX(-50%);border:2px solid var(--accent-ink)}

/* dot squares: spaced dots, rows in two colours so each row is easy to count */
.sqwrap{display:grid;gap:6px;justify-items:start}
.sqgrid{display:grid;gap:8px;width:max-content;max-width:100%;padding:8px;border:1px dashed var(--line);border-radius:8px}
.sqgrid span{width:13px;height:13px;border-radius:50%;background:var(--sea)}
.sqgrid span.r1{background:var(--accent)}
.sqgrid.dense{gap:5px}.sqgrid.dense span{width:10px;height:10px}

/* diagrams */
.diagram{width:100%;max-width:340px;height:auto;display:block}
.diagram .d-ink{fill:var(--ink)}
.diagram .d-muted{fill:var(--muted)}
.diagram .d-sea{fill:var(--sea)}
.diagram .d-acc{fill:var(--accent)}
.diagram .d-line{stroke:var(--muted);stroke-width:2;fill:none}
.diagram .d-sea-line{stroke:var(--sea);stroke-width:2.5;fill:none}
.diagram .d-acc-line{stroke:var(--accent);stroke-width:2.5;fill:none}
.diagram .d-node{fill:var(--surface);stroke:var(--sea);stroke-width:2.5}
.diagram text{font-family:var(--font-body)}
.diagram .d-big{font-family:var(--font-display);font-weight:800}

/* factor tree */
.tree-scroll{overflow-x:auto;padding:4px 0 8px}
.tree-inner{width:max-content;margin:0 auto;padding:0 4px}
.tnode{display:flex;flex-direction:column;align-items:center;position:relative}
.tkids{display:flex;gap:14px;padding-top:12px;position:relative;align-items:flex-start}
.tkids::before{content:"";position:absolute;top:0;left:50%;width:2px;height:12px;background:var(--muted);transform:translate(-50%,-12px)}
.tkids>.tnode{padding-top:12px}
.tkids>.tnode::before{content:"";position:absolute;top:0;left:50%;width:2px;height:12px;background:var(--muted);transform:translateX(-50%)}
.tkids>.tnode:first-child::after{content:"";position:absolute;top:0;left:50%;right:-7px;border-top:2px solid var(--muted)}
.tkids>.tnode:last-child::after{content:"";position:absolute;top:0;left:-7px;right:50%;border-top:2px solid var(--muted)}
.tchip{min-width:52px;height:44px;padding:0 10px;border-radius:22px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:1.05rem}
span.tchip{display:inline-grid;place-items:center}
.tchip.open{border:2px dashed var(--accent);cursor:pointer;background:var(--surface)}
.tchip.open.active{background:var(--accent);color:var(--accent-ink);border-style:solid}
.tchip.prime{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tchip.split{color:var(--muted)}
.split-form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.split-form input{width:5.2em;font:inherit;font-size:1.1rem;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.split-form input:focus{outline:none;border-color:var(--sea)}

/* exercise book for find-the-fault */
.book{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 44px;position:relative;
  background-image:repeating-linear-gradient(var(--paper) 0 35px,var(--rule) 35px 36px);
  font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive;font-size:1.25rem;line-height:36px}
.book::before{content:"";position:absolute;top:0;bottom:0;left:30px;border-left:2px solid var(--margin)}
.book .ln{display:block;position:relative}
.book .ln::before{content:attr(data-n);position:absolute;left:-36px;width:22px;text-align:right;color:var(--muted);font-family:var(--font-body);font-size:.75rem}
.task{font-weight:500}

/* results and badge */
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;text-align:center;justify-items:center}
.result .score{font-family:var(--font-display);font-weight:800;font-size:3.2rem;color:var(--sea);line-height:1}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.badge-panel h2{font-size:1.25rem}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.badge{border-radius:14px;overflow:hidden;border:2px solid var(--accent);background:var(--surface);max-width:460px;width:100%;justify-self:center}
.badge-top{background:var(--band);color:var(--band-ink);padding:12px 16px;display:grid;gap:2px}
.badge-top b{font-family:var(--font-display);font-size:1.2rem;font-weight:800}
.badge-top b span{color:var(--accent)}
.badge-top small{color:var(--band-muted);font-size:.8rem}
.badge-body{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px}
.seal{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2rem;font-weight:800;
  box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
.b-name{font-family:var(--font-display);font-weight:800;font-size:1.3rem}
.b-meta{font-size:.85rem;color:var(--muted)}
.b-title{font-weight:600;margin-top:4px}
.b-lines{font-size:.92rem}
.b-lines p{margin:0}
.badge-actions{display:grid;gap:10px}
.copybox{width:100%;font:inherit;font-size:.9rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:5em}
.email-line{font-size:.95rem}
.email-line a{color:var(--sea);font-weight:600}
.addr{font-weight:600;user-select:all;-webkit-user-select:all}

/* teacher view */
.teacher-bar{background:var(--teach-bg);border:2px solid var(--teach);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.teacher-bar h2{color:var(--teach);font-size:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--ink);text-decoration:none}
.t-topic{display:grid;gap:12px;scroll-margin-top:12px}
.t-topic>h2{font-size:1.45rem;border-bottom:2px solid var(--line);padding-bottom:6px}
.t-q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.t-q .tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--teach);font-weight:600}
.t-step{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px;min-width:0}
.ans{background:var(--good-bg);border-radius:8px;padding:6px 10px}
.ans b{color:var(--good)}
.opt{display:grid;gap:2px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt .why{font-size:.85rem;color:var(--muted)}
.explain{font-size:.95rem;display:grid;gap:8px;min-width:0}

.card .sym svg,.ticon svg{width:34px;height:34px}
.ticon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.qhead{display:flex;gap:12px;align-items:center}
.qhead .qtext{display:grid;gap:2px}
.arrs{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;overflow-x:auto;padding-bottom:2px}
.arr{display:grid;gap:5px;justify-items:center}
.arr .ad{display:grid;gap:4px}
.arr .ad span{width:9px;height:9px;border-radius:50%;background:var(--sea)}
.arr.alt .ad span{background:var(--accent)}
.arr .al{font-size:.8rem;color:var(--muted);font-weight:600}
.groups{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:grid;justify-items:center;border-radius:10px;padding:6px 14px;gap:2px}
.grp .gd{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:.08em}
.grp .gl{font-size:.75rem;font-weight:600}
.g0{background:var(--t1);color:var(--t1-ink)} .g1{background:var(--t2);color:var(--t2-ink)} .g2{background:var(--t4);color:var(--t4-ink)}
.diagram .d-ring{stroke:var(--accent);stroke-width:2.5;fill:none}

function under1000(x){let s='';const h=Math.floor(x/100),r=x%100;if(h)s+=ONES[h]+' hundred';if(r){if(h)s+=' and ';s+=r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?'-'+ONES[r%10]:'');}return s;}

function autoTree(n){
  if(isPrime(n))return {v:n,kids:null};

const ICONS={

/* reading big numbers in groups of three */
function groupsHTML(N){
  const m=Math.floor(N/1e6),t=Math.floor(N/1000)%1000,r=N%1000;const g=[];
  if(m)g.push([String(m),'say “million”']);

function arraysHTML(pairs){return '<div class="arrs" role="img" aria-label="Dot arrays: '+pairs.map(p=>p[0]+' by '+p[1]).join(', ')+'">'+pairs.map((p,i)=>arrayHTML(p[0],p[1],i%2)).join('')+'</div>';}
/* factor rainbow: arcs join each pair of factors */
function rainbow(N){
  const fs=factorsOf(N),k=fs.length,W=340,m=16,step=(W-2*m)/(k-1),xs=fs.map((_,i)=>m+i*step);
  const arcs=[];let maxR=0;
  for(let i=0;i<Math.floor(k/2);i++){const x1=xs[i],x2=xs[k-1-i],rx=(x2-x1)/2,ry=Math.max(12,rx*.55);maxR=Math.max(maxR,ry);arcs.push([x1,x2,rx,ry,i]);}
  const base=maxR+12,fsz=k>10?12:13;
  let h='<svg class="diagram" viewBox="0 0 '+W+' '+(base+30)+'" role="img" aria-label="Factor rainbow for '+N+'">';
  arcs.forEach(a=>{h+='<path d="M '+a[0].toFixed(1)+' '+base+' A '+a[2].toFixed(1)+' '+a[3].toFixed(1)+' 0 0 1 '+a[1].toFixed(1)+' '+base+'" class="'+(a[4]%2?'d-acc-line':'d-sea-line')+'"/>';});
  if(k%2)h+='<circle cx="'+xs[(k-1)/2].toFixed(1)+'" cy="'+(base+15)+'" r="12" class="d-ring"/>';
  fs.forEach((f,i)=>{h+='<text x="'+xs[i].toFixed(1)+'" y="'+(base+20)+'" text-anchor="middle" font-size="'+fsz+'" font-weight="600" class="d-ink">'+f+'</text>';});
  h+='</svg>';
  const ex=k>2?' For example, '+fs[1]+' × '+fs[k-2]+' = '+N+'.':'';
  return h+'<p class="small">This is a factor rainbow. Each arc joins two factors that multiply to make '+N+'.'+ex+(k%2?' The circled number is multiplied by itself.':'')+'</p>';
}
/* skip-counting hops on a number line */
function hops(stepN,count){
  const W=340,m=18,max=stepN*count,sc=(W-2*m)/max,X=v=>(m+v*sc).toFixed(1),y=62;const id='hp'+(++uid);
  let h='<svg class="diagram" viewBox="0 0 '+W+' 96" role="img" aria-label="Counting in '+stepN+'s"><defs>'+arrowMarker(id,'d-sea')+'</defs><line x1="'+m+'" y1="'+y+'" x2="'+(W-m)+'" y2="'+y+'" class="d-axis"/>';
  for(let i=0;i<=count;i++){const v=i*stepN;h+='<line x1="'+X(v)+'" y1="'+(y-6)+'" x2="'+X(v)+'" y2="'+(y+6)+'" class="d-axis"/><text x="'+X(v)+'" y="'+(y+24)+'" text-anchor="middle" font-size="13" font-weight="600" class="d-ink">'+v+'</text>';
    if(i<count){const a=X(v),b=X(v+stepN),mid=((+a)+(+b))/2;h+='<path d="M '+a+' '+(y-8)+' Q '+mid+' '+(y-40)+' '+b+' '+(y-10)+'" class="d-sea-line" marker-end="url(#'+id+')"/><text x="'+mid+'" y="'+(y-30)+'" text-anchor="middle" font-size="11" class="d-muted">+'+stepN+'</text>';}}
  return h+'</svg>';
}
/* double number line: hops of a on top, hops of b below, meeting at the LCM */
function doubleHops(a,b){
  const L=a*b/gcd(a,b),W=340,m=18,sc=(W-2*m)/L,X=v=>(m+v*sc).toFixed(1),y1=50,y2=118;
  let h='<svg class="diagram" viewBox="0 0 '+W+' 160" role="img" aria-label="Counting in '+a+'s and '+b+'s meets at '+L+'">';
  const line=(stepN,y,cls,up)=>{let s='<line x1="'+m+'" y1="'+y+'" x2="'+(W-m)+'" y2="'+y+'" class="d-axis"/><text x="'+m+'" y="'+(up?y-30:y+40)+'" font-size="12" font-weight="600" class="d-muted">Count in '+stepN+'s</text>';
    for(let v=0;v<=L;v+=stepN){s+='<line x1="'+X(v)+'" y1="'+(y-6)+'" x2="'+X(v)+'" y2="'+(y+6)+'" class="d-axis"/><text x="'+X(v)+'" y="'+(y+20)+'" text-anchor="middle" font-size="12" font-weight="600" class="d-ink">'+v+'</text>';
      if(v<L){const p=X(v),q=X(v+stepN),mid=((+p)+(+q))/2;s+='<path d="M '+p+' '+(y-7)+' Q '+mid+' '+(y-26)+' '+q+' '+(y-7)+'" class="'+cls+'"/>';}}
    return s;};
  h+=line(a,y1,'d-sea-line',true)+line(b,y2,'d-acc-line',false);
  h+='<line x1="'+X(L)+'" y1="'+(y1-20)+'" x2="'+X(L)+'" y2="'+(y2+28)+'" class="d-dash"/><circle cx="'+X(L)+'" cy="'+(y1+16)+'" r="11" class="d-ring"/><circle cx="'+X(L)+'" cy="'+(y2+16)+'" r="11" class="d-ring"/>';
  return h+'</svg><p class="small">Counting in '+a+'s and counting in '+b+'s first land on the same number at <b>'+L+'</b>. That is the LCM.</p>';

function splitOrLineUp(){

/* HCF and LCM by listing and circling, the way the class learned it */
const HCF_PAIRS=[[16,24],[18,24],[20,30],[24,36],[18,27],[28,42],[30,45],[16,40],[24,40],[36,48],[20,50],[32,48],[27,36],[30,42]];
const LCM_PAIRS=[[4,6],[6,8],[6,9],[8,12],[4,10],[9,12],[10,15],[12,18],[8,10],[12,16],[15,20]];
function hcfList(){
  const [a,b]=pick(HCF_PAIRS);const fa=factorsOf(a),fb=factorsOf(b);const common=fa.filter(x=>fb.includes(x));const H=Math.max(...common);const L=a*b/gcd(a,b);
  return {topic:'hcf',prompt:'<p>Find the <b>HCF</b> (Highest Common Factor) of <b>'+a+'</b> and <b>'+b+'</b>.</p><p class="small">In your book, list the factors of each number first. Then check your lists against the ones below.</p>',
    steps:[
      {type:'circle',label:'Step 1. Circle the <b>common factors</b>. Tap every number that is in <b>both</b> lists.',
        rows:[{label:'Factors of '+a,vals:fa},{label:'Factors of '+b,vals:fb}],kind:'factor',
        explain:'The common factors of '+a+' and '+b+' are <b>'+common.join(', ')+'</b>.'},
      {type:'input',label:'Step 2. The common factors are '+common.join(', ')+'. What is the HCF?',answer:H,
        wrong:v=>v===common[0]?'That is the <b>lowest</b> common factor. HCF stands for <b>Highest</b> Common Factor, so choose the biggest one.':common.includes(v)?v+' is a common factor, but it is not the highest one.':v===L?'That is the LCM. The HCF must be a factor of both numbers, so it cannot be bigger than '+a+'.':(fa.includes(v)||fb.includes(v))?v+' is only in one of the lists. The HCF must be in both lists.':'Choose the biggest number from the common factors.',
        explain:'The highest of the common factors is <b>'+H+'</b>. So the HCF of '+a+' and '+b+' is '+H+'.'}]};
}
function lcmList(){
  const [a,b]=pick(LCM_PAIRS);const L=a*b/gcd(a,b);
  const ma=[],mb=[];for(let x=a;x<=2*L;x+=a)ma.push(x);for(let x=b;x<=2*L;x+=b)mb.push(x);
  const common=ma.filter(x=>mb.includes(x));
  return {topic:'hcf',prompt:'<p>Find the <b>LCM</b> (Lowest Common Multiple) of <b>'+a+'</b> and <b>'+b+'</b>.</p><p class="small">In your book, list the multiples of each number first. Then check your lists against the ones below.</p>',
    steps:[
      {type:'circle',label:'Step 1. Circle the <b>common multiples</b>. Tap every number that is in <b>both</b> lists.',
        rows:[{label:'Multiples of '+a,vals:ma},{label:'Multiples of '+b,vals:mb}],kind:'multiple',
        explain:'The common multiples in these lists are <b>'+common.join(', ')+'</b>. The lists go on forever, so there are more common multiples after these.'},
      {type:'input',label:'Step 2. The common multiples are '+common.join(', ')+' and so on. What is the LCM?',answer:L,
        wrong:v=>v===a*b&&a*b!==L?'You multiplied '+a+' × '+b+'. That gives a common multiple, but not the lowest one. Look at the numbers you circled.':v===2*L?'That is a common multiple, but not the lowest one.':v===gcd(a,b)?'That is the HCF. The LCM must be in both times tables, so it cannot be smaller than '+b+'.':(ma.includes(v)||mb.includes(v))?v+' is only in one of the lists. The LCM must be in both.':'Choose the smallest number from the common multiples.',

    LCM:'This question is about waiting for two things to <b>line up</b> again. The times (or amounts) are in both times tables, so you need a common <b>multiple</b>. You want the first one, so it is the <b>LCM</b>.'};

      explain:'Ask yourself: am I sharing or splitting something up? That is the HCF. Am I waiting for things to line up again? That is the LCM.'+splitOrLineUp()}]};

/* ---------- ticket: a code that only works with the student's own name and class ---------- */
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
function fnv(str,seed){let h=seed>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function ticketCode(name,cls){
  const s=TICKET_SALT+'|'+normName(name)+'|'+String(cls||'').toUpperCase()+'|all9';
  const h=fnv(s,2166136261),g=fnv(s.split('').reverse().join(''),374761393);let out='';
  for(let i=0;i<6;i++){const v=i<3?h:g;out+=CODE_ABC[Math.floor(v/Math.pow(31,i%3))%31];}
  return out.slice(0,3)+'-'+out.slice(3);
}
const cleanCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function checkTicket(name,cls,code){
  const c=cleanCode(code);if(!normName(name)||c.length!==6)return {ok:false};
  if(cleanCode(ticketCode(name,cls))===c)return {ok:true,cls:String(cls).toUpperCase()};
  for(const k of CLASSES)if(cleanCode(ticketCode(name,k))===c)return {ok:true,cls:k,classMismatch:true};
  return {ok:false};
}
function parseStamp(s){
  s=String(s||'').trim();if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){const d=new Date(s.replace(' ','T'));return isNaN(d)?null:d;}
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);if(!m)return null;
  const a=+m[1],b=+m[2],y=+m[3],mk=(d,mo)=>new Date(y,mo-1,d,+(m[4]||0),+(m[5]||0),+(m[6]||0));
  const c=[];if(a<=12&&b<=31)c.push(mk(b,a));if(b<=12&&a<=31)c.push(mk(a,b));if(!c.length)return null;
  const now=Date.now();c.sort((x,z)=>Math.abs(x-now)-Math.abs(z-now));return c[0];
}

const scrollTo=n=>{try{n.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'nearest'});}catch(e){}};
const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();

function runStep(step,host,done){
  const box=el('div','step');host.appendChild(box);
  if(step.label&&step.type!=='tree')box.appendChild(el('p','step-q',step.label));
  const fb=el('div','fb');fb.hidden=true;fb.setAttribute('role','status');
  const show=(kind,html)=>{fb.hidden=false;fb.className='fb '+kind;fb.innerHTML=html;scrollTo(fb);};
  let tries=0;

  if(step.type==='input'){
    const row=el('div','answer-row');const inp=el('input');inp.type='text';inp.inputMode=step.list?'text':'numeric';
    inp.autocomplete='off';inp.id='ans'+(++uid);inp.setAttribute('aria-label','Your answer');inp.placeholder=step.list?'e.g. 5, 10, 15':'Your answer';
    const btn=el('button','btn primary','Check');row.append(inp,btn);box.append(row,fb);
    const lock=()=>{inp.disabled=true;btn.disabled=true;};
    const check=()=>{
      const raw=inp.value.trim();if(!raw){show('note','Type your answer first.');return;}
      let v,ok;
      if(step.list){v=parseList(raw);if(!v.length||v.some(isNaN)){show('note','Type whole numbers with commas between them, like 5, 10, 15.');return;}ok=step.check(v);}
      else{v=parseNum(raw);if(isNaN(v)){show('note','Type a whole number using digits only, like 4 500.');return;}ok=step.check?step.check(v):v===step.answer;}
      if(ok){show('good','<b>Correct.</b> '+(step.explain||''));lock();done(tries===0);}
      else{tries++;const w=step.wrong?step.wrong(v):'';
        if(tries<2)show('bad','<b>Not yet.</b> <span>'+w+'</span> <span class="again">Try again.</span>');
        else{show('bad','<b>Not yet.</b> <span>'+w+'</span><div class="reveal"><p><b>The answer is '+(step.answerText||fmt(step.answer))+'.</b></p>'+(step.explain?'<div>'+step.explain+'</div>':'')+'</div>');lock();done(false);}}
    };
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  }

  if(step.type==='choice'){
    const list=el('div','choices');box.append(list,fb);const maxTries=Math.min(2,step.options.length-1);let locked=false;
    const btns=step.options.map(o=>{const b=el('button','choice',o.text);list.appendChild(b);return {b,o};});
    const lockAll=()=>{locked=true;btns.forEach(x=>x.b.disabled=true);};
    btns.forEach(({b,o})=>b.onclick=()=>{
      if(locked)return;
      if(o.correct){b.classList.add('right');show('good','<b>Correct.</b> '+(o.why?o.why+' ':'')+(step.explain||''));lockAll();done(tries===0);return;}
      tries++;b.classList.add('wrong');b.disabled=true;
      if(tries<maxTries)show('bad','<b>Not yet.</b> '+(o.why||'')+' <span class="again">Try again.</span>');
      else{const c=btns.find(x=>x.o.correct);c.b.classList.add('right');
        show('bad','<b>Not yet.</b> '+(o.why||'')+'<div class="reveal"><p><b>The answer is: '+c.o.text+'.</b> '+(c.o.why||'')+'</p>'+(step.explain?'<div>'+step.explain+'</div>':'')+'</div>');lockAll();done(false);}
    });
  }

  if(step.type==='multi'){
    const grid=el('div','tiles');const btn=el('button','btn primary','Check');const row=el('div','answer-row');row.appendChild(btn);box.append(grid,row,fb);
    const ts=step.tiles.map(t=>{const b=el('button','tile',String(t.v));b.setAttribute('aria-pressed','false');b.onclick=()=>{if(b.disabled)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');};grid.appendChild(b);return {b,t};});
    btn.onclick=()=>{
      const on=x=>x.b.getAttribute('aria-pressed')==='true';
      const missed=ts.filter(x=>x.t.correct&&!on(x)),extra=ts.filter(x=>!x.t.correct&&on(x));
      if(!missed.length&&!extra.length){ts.forEach(x=>{if(x.t.correct)x.b.classList.add('right');x.b.disabled=true;});btn.disabled=true;show('good','<b>Correct.</b> '+step.explain);done(tries===0);return;}
      tries++;
      if(tries<2){
        const bits=[];if(extra.length)bits.push('You have chosen '+(extra.length===1?'one number':extra.length+' numbers')+' that should not be there.');
        if(missed.length)bits.push('You have missed '+(missed.length===1?'one number':missed.length+' numbers')+'.');
        const hint=extra.length?'<p>'+extra[0].t.whyWrong+'</p>':'';
        show('bad','<b>Not yet.</b> <p>'+bits.join(' ')+'</p>'+hint+'<span class="again">Change your choices and press Check again.</span>');
      }else{
        ts.forEach(x=>{x.b.disabled=true;if(x.t.correct)x.b.classList.add(on(x)?'right':'missed');else if(on(x))x.b.classList.add('wrong');});btn.disabled=true;
        const lines=extra.map(x=>x.t.whyWrong).concat(missed.map(x=>x.t.whyMissed));
        show('bad','<b>Not yet.</b><ul>'+lines.map(l=>'<li>'+l+'</li>').join('')+'</ul><div class="reveal">'+step.explain+'</div>');done(false);
      }
    };
  }

  if(step.type==='circle'){
    const rows=step.rows;const common=rows[0].vals.filter(v=>rows.every(r=>r.vals.includes(v)));
    const sel=new Set();const tiles=[];
    rows.forEach(r=>{const wrap=el('div','crow');wrap.appendChild(el('p','crow-label',r.label+':'));const g=el('div','tiles');
      r.vals.forEach(v=>{const b=el('button','tile',String(v));b.setAttribute('aria-pressed','false');b.dataset.v=v;
        b.onclick=()=>{if(b.disabled)return;sel.has(v)?sel.delete(v):sel.add(v);tiles.forEach(t=>t.setAttribute('aria-pressed',sel.has(+t.dataset.v)?'true':'false'));};
        g.appendChild(b);tiles.push(b);});
      wrap.appendChild(g);box.appendChild(wrap);});
    const btn=el('button','btn primary','Check');const row=el('div','answer-row');row.appendChild(btn);box.append(row,fb);
    const lo=s=>s.charAt(0).toLowerCase()+s.slice(1);
    const why=v=>{const inR=rows.filter(r=>r.vals.includes(v)),outR=rows.filter(r=>!r.vals.includes(v));return v+' is in the '+lo(inR[0].label)+' list, but it is not in the '+lo(outR[0].label)+' list.';};
    btn.onclick=()=>{
      const extra=[...sel].filter(v=>!common.includes(v)),missed=common.filter(v=>!sel.has(v));
      if(!extra.length&&!missed.length){tiles.forEach(t=>{t.disabled=true;if(common.includes(+t.dataset.v))t.classList.add('right');});btn.disabled=true;show('good','<b>Correct.</b> '+step.explain);done(tries===0);return;}
      tries++;
      if(tries<2){
        const bits=[];if(extra.length)bits.push('You have circled '+(extra.length===1?'one number':extra.length+' numbers')+' that is not in both lists.'.replace('that is',extra.length===1?'that is':'that are'));
        if(missed.length)bits.push('You have missed '+(missed.length===1?'one number':missed.length+' numbers')+' that '+(missed.length===1?'is':'are')+' in both lists.');
        show('bad','<b>Not yet.</b> <p>'+bits.join(' ')+'</p>'+(extra.length?'<p>'+why(extra[0])+'</p>':'')+'<span class="again">Change your circles and press Check again.</span>');
      }else{
        tiles.forEach(t=>{const v=+t.dataset.v;t.disabled=true;if(common.includes(v))t.classList.add(sel.has(v)?'right':'missed');else if(sel.has(v))t.classList.add('wrong');});btn.disabled=true;
        const lines=extra.map(why).concat(missed.map(v=>'You missed '+v+'. It is in both lists.'));
        show('bad','<b>Not yet.</b><ul>'+lines.map(l=>'<li>'+l+'</li>').join('')+'</ul><div class="reveal">'+step.explain+'</div>');done(false);
      }
    };
  }

  if(step.type==='tree'){
    const N=step.n;const root={v:N,kids:null};let mistakes=0,active=null;
    box.appendChild(el('p','step-q','Tap a number with a dashed border to split it into two factors. Keep going until every branch ends in a prime number.'));
    const area=el('div','tree-scroll');const form=el('div','split-form');form.hidden=true;box.append(area,form,fb);
    const nodeEl=nd=>{
      const w=el('div','tnode');const chip=el('button','tchip',String(nd.v));
      if(nd.kids){chip.disabled=true;chip.classList.add('split');w.appendChild(chip);const k=el('div','tkids');nd.kids.forEach(c=>k.appendChild(nodeEl(c)));w.appendChild(k);}
      else if(isPrime(nd.v)){chip.disabled=true;chip.classList.add('prime');chip.setAttribute('aria-label',nd.v+', a prime number');w.appendChild(chip);}
      else{chip.classList.add('open');if(active===nd)chip.classList.add('active');chip.setAttribute('aria-label','Split '+nd.v);chip.onclick=()=>openForm(nd);w.appendChild(chip);}
      return w;};
    const draw=()=>{area.innerHTML='';const inner=el('div','tree-inner');inner.appendChild(nodeEl(root));area.appendChild(inner);};
    const openForm=nd=>{
      active=nd;draw();form.hidden=false;form.innerHTML='';
      const a=el('input');const b=el('input');[a,b].forEach((x,i)=>{x.type='text';x.inputMode='numeric';x.autocomplete='off';x.id='sp'+(++uid);x.setAttribute('aria-label',i?'Second factor':'First factor');});
      const go=el('button','btn primary','Split');
      form.append(el('span',null,'Split <b>'+nd.v+'</b>:'),a,el('span',null,'×'),b,el('span',null,'= '+nd.v),go);
      const submit=()=>{
        const x=parseNum(a.value),y=parseNum(b.value);
        if(isNaN(x)||isNaN(y)){show('note','Type a whole number in each box.');return;}
        if(x===1||y===1){mistakes++;show('bad','Splitting into 1 × '+nd.v+' does not help, because '+nd.v+' is still there. Use two numbers that are both bigger than 1.');return;}
        if(x*y!==nd.v){mistakes++;show('bad',x+' × '+y+' = '+(x*y)+', not '+nd.v+'. Choose two numbers that multiply to give '+nd.v+'.');return;}
        nd.kids=[{v:x,kids:null},{v:y,kids:null}];active=null;form.hidden=true;draw();
        const ls=treeLeaves(root);const comps=ls.filter(v=>!isPrime(v));
        if(!comps.length){const ps=ls.slice().sort((p,q)=>p-q);
          show('good','<b>Tree finished.</b> Every branch ends in a prime number. So <b>'+N+' = '+ps.join(' × ')+'</b><p class="small">In index form, you can write this as '+indexForm(ps)+'.</p>'+(mistakes?'':'<p>No mistakes. Well done.</p>'));done(mistakes===0);}
        else show('note','Good: '+nd.v+' = '+x+' × '+y+'. '+(comps.length===1?comps[0]+' is not prime yet, so split it.':comps.join(' and ')+' are not prime yet, so split them.'));
      };
      go.onclick=submit;[a,b].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}}));
      try{a.focus({preventScroll:true});}catch(e){}
    };
    draw();
  }
  return box;
}

const app=typeof document!=='undefined'?document.getElementById('app'):null;
let S=null;
const today=()=>new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

function home(){
  S=null;app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  col.appendChild(el('section','howto','<h2>How to use this</h2><ol><li>Pick a topic, or choose Mixed practice.</li><li>Answer each step. Write your working in your exercise book as you go, just like on the quiz.</li><li>If you get something wrong, read the explanation carefully, then try again.</li></ol><p class="small">Stuck? Every question has a "Remind me how this works" box with a worked example.</p>'));
  if(!storageOK)col.appendChild(el('p','warn','This page cannot remember your progress after you close it. Try to finish your topics in one visit, or open the Study Lab from its own link instead.'));
  col.appendChild(ticketStrip());
  const mx=el('button','mixed','<span class="sym">10</span><h3>Mixed practice</h3><p>Ten questions from every topic, mixed together, like the real quiz.</p>');
  const mb=store.get('mixed');if(mb)mx.querySelector('p').innerHTML+=' <b>Your best: '+mb.s+' out of '+mb.n+'.</b>';
  mx.onclick=()=>start('mixed');col.appendChild(mx);
  col.appendChild(el('p','section-label','Practise one topic'));
  const g=el('div','grid');col.appendChild(g);
  TOPICS.forEach(T=>{
    const c=el('button','card tint'+T.tint,'<span class="sym">'+T.sym+'</span><h3>'+T.name+'</h3><p>'+T.blurb+'</p>');
    const b=store.get(T.id);if(b)c.appendChild(el('span','best','Done. Your best: '+b.s+' out of '+b.n));
    c.onclick=()=>start(T.id);g.appendChild(c);
  });
  col.appendChild(el('p','motto','<i>Nous ne sommes pas impuissants.</i> We are not helpless.'));
}

function ticketStrip(){
  const n=doneTopics().length,total=TOPICS.length;
  const w=el('section','ticket-strip');
  w.appendChild(el('h2',null,'Your ticket for '+TEACHER_NAME));
  const segs=el('div','segs');segs.setAttribute('aria-label',n+' of '+total+' topics finished');TOPICS.forEach(T=>segs.appendChild(el('span',store.get(T.id)?'on':'')));w.appendChild(segs);
  if(!ticketsOpen()){
    w.appendChild(el('p',null,'Tickets closed at '+TICKET_CLOSES_TEXT+'. You can still practise any topic.'));
  }else if(n<total){
    w.appendChild(el('p',null,'Finish all '+total+' topics to get your ticket. You have finished <b>'+n+' of '+total+'</b>. Tickets close at '+TICKET_CLOSES_TEXT+'.'));
    const left=TOPICS.filter(T=>!store.get(T.id)).map(T=>T.name);
    if(n)w.appendChild(el('p','todo','Still to do: '+left.join(', ')+'.'));
  }else{
    w.appendChild(el('p',null,'You have finished all '+total+' topics. Well done!'));
  }
  const row=el('div','btns');row.style.justifyContent='flex-start';
  if(n===total){const b=el('button','btn '+(ticketsOpen()?'primary':'secondary'),ticketsOpen()?'Get my ticket':'View my ticket');b.onclick=ticketScreen;row.appendChild(b);}
  else if(n){const b=el('button','btn secondary','See my badge');b.onclick=progressBadge;row.appendChild(b);}
  if(row.children.length)w.appendChild(row);
  return w;
}

function start(id){S={id,qs:makeRound(id),i:0,score:0,res:[]};showQ();window.scrollTo(0,0);}

function showQ(){
  app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  const q=S.qs[S.i];const T=TOPIC_BY_ID[q.topic];
  const top=el('div','topbar');const back=el('button','back','← All topics');back.onclick=home;
  const dots=el('div','dots');dots.setAttribute('aria-label','Question '+(S.i+1)+' of '+S.qs.length);
  S.qs.forEach((_,i)=>dots.appendChild(el('span','dot'+(i<S.i?(S.res[i]?' ok':' miss'):i===S.i?' now':''))));
  top.append(back,dots);col.appendChild(top);
  col.appendChild(el('div','qhead tint'+T.tint,'<span class="ticon sym">'+T.sym+'</span><div class="qtext"><span class="count">'+(S.id==='mixed'?'Mixed practice · ':'')+'Question '+(S.i+1)+' of '+S.qs.length+'</span><h2>'+T.name+'</h2></div>'));
  const rem=el('details','remind','<summary>Remind me how this works</summary><div class="remind-body">'+T.remind()+'</div>');if(S.i===0)rem.open=true;col.appendChild(rem);
  const card=el('section','qcard');col.appendChild(card);
  card.appendChild(el('div','prompt',q.prompt));
  const stepsHost=el('div');stepsHost.style.display='grid';stepsHost.style.gap='14px';card.appendChild(stepsHost);
  let k=0,allFirst=true;
  const next=()=>{
    if(k>=q.steps.length){
      S.res[S.i]=allFirst;if(allFirst)S.score++;
      const row=el('div','next-row');const last=S.i===S.qs.length-1;
      const b=el('button','btn primary',last?'See my results':'Next question →');
      b.onclick=()=>{if(last)results();else{S.i++;showQ();window.scrollTo(0,0);}};
      row.appendChild(b);card.appendChild(row);scrollTo(row);return;}
    const st=q.steps[k++];runStep(st,stepsHost,first=>{if(!first)allFirst=false;next();});
  };
  next();
}

function results(){
  app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  const n=S.qs.length,s=S.score,id=S.id;
  const name=id==='mixed'?'Mixed practice':TOPIC_BY_ID[id].name;
  const before=allDone();
  const prev=store.get(id);if(!prev||s/n>prev.s/prev.n)store.set(id,{s,n});
  const justFinished=!before&&allDone();
  const msg=s===n?'Excellent work. You got every question right the first time.':s>=n/2?'Good work. Have another go with new numbers to make it stronger.':'Keep going. Read the explanations, then practise again with new numbers. Every mistake shows you what to fix.';
  const r=el('section','result','<p class="section-label">'+name+'</p><p class="score">'+s+' / '+n+'</p><p>right the first time</p><p>'+msg+'</p>');
  const btns=el('div','btns');const again=el('button','btn primary','Practise again with new numbers');again.onclick=()=>start(id);
  const back=el('button','btn secondary','Choose another topic');back.onclick=home;btns.append(again,back);r.appendChild(btns);col.appendChild(r);
  if(allDone()&&ticketsOpen()){const c=el('section','callout','<h2>'+(justFinished?'You have finished all '+TOPICS.length+' topics!':'Your ticket is ready')+'</h2><p>Get your ticket and send it to '+TEACHER_NAME+'.</p>');const b=el('button','btn primary','Get my ticket');b.onclick=ticketScreen;c.appendChild(b);col.appendChild(c);}
  col.appendChild(badgePanel({title:'Completed: '+name,lines:[s+' out of '+n+' right the first time'],msgTopic:name+' ('+s+' out of '+n+' right the first time)'}));
  window.scrollTo(0,0);
}

function progressBadge(){
  app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  const top=el('div','topbar');const back=el('button','back','← All topics');back.onclick=home;top.appendChild(back);col.appendChild(top);
  const lines=[];const parts=[];
  TOPICS.concat([{id:'mixed',name:'Mixed practice'}]).forEach(T=>{const b=store.get(T.id);if(b){lines.push('✓ '+T.name+': best '+b.s+' out of '+b.n);parts.push(T.name+' (best '+b.s+'/'+b.n+')');}});
  const total=TOPICS.filter(T=>store.get(T.id)).length;
  const left=TOPICS.filter(T=>!store.get(T.id)).map(T=>T.name);
  if(left.length)col.appendChild(el('p','warn','To get your ticket, finish these topics too: '+left.join(', ')+'.'));
  col.appendChild(badgePanel({title:total===TOPICS.length?'Completed all '+TOPICS.length+' topics':'Topics finished: '+total+' of '+TOPICS.length,lines,msgTopic:parts.join(', ')}));
  window.scrollTo(0,0);
}

/* The ticket: shown when all 9 topics are finished. The Form is the main way in; the backups always show. */
function ticketScreen(){
  if(!allDone()){progressBadge();return;}
  app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  const top=el('div','topbar');const back=el('button','back','← All topics');back.onclick=home;top.appendChild(back);col.appendChild(top);
  const p=el('section','badge-panel');col.appendChild(p);
  p.appendChild(el('h2',null,'Your Study Lab ticket'));
  const open=ticketsOpen();
  if(!open)p.appendChild(el('p','warn','Tickets closed at '+TICKET_CLOSES_TEXT+'. You can still practise, but tickets cannot be handed in any more.'));
  else p.appendChild(el('p','small','Type your name exactly as your teacher knows it, and choose your class. Your code is made from them.'));
  const f=el('div','fields','<div class="field"><label for="badge-name">Your full name</label><input id="badge-name" type="text" autocomplete="name" placeholder="First and last name"></div><div class="field"><label for="badge-class">Class</label><select id="badge-class"><option value="">Choose</option>'+CLASSES.map(c=>'<option>'+c+'</option>').join('')+'</select></div>');
  p.appendChild(f);
  const nameIn=f.querySelector('#badge-name'),clsIn=f.querySelector('#badge-class');
  nameIn.value=store.get('name')||'';clsIn.value=store.get('class')||'';
  const card=el('div','badge');p.appendChild(card);
  const date=today();
  const scoreLines=()=>{const L=[];for(let i=0;i<TOPICS.length;i+=2)L.push(TOPICS.slice(i,i+2).map(T=>{const b=store.get(T.id);return T.name+' '+b.s+'/'+b.n;}).join(' · '));return L;};
  const ready=()=>nameIn.value.trim().length>1&&clsIn.value;
  const code=()=>ready()?ticketCode(nameIn.value.trim(),clsIn.value):'';
  const draw=()=>{
    card.innerHTML='<div class="badge-top"><b>Whole Numbers <span>Study Lab</span></b><small>Ticket · Form 1 Mathematics · Quiz 1 revision</small></div>'+
      '<div class="badge-body"><div class="seal" aria-hidden="true">✓</div><div><p class="b-name"></p><p class="b-meta"></p><p class="b-title">Completed all '+TOPICS.length+' topics</p><p class="small">Completion code</p><p class="tcode"></p><div class="b-lines small"></div></div></div>';
    card.querySelector('.b-name').textContent=nameIn.value.trim()||'Your name';
    card.querySelector('.b-meta').textContent=(clsIn.value?clsIn.value+' · ':'')+date;
    card.querySelector('.tcode').textContent=code()||'Type your name and class';
    const bl=card.querySelector('.b-lines');scoreLines().forEach(l=>{const q=document.createElement('p');q.textContent=l;bl.appendChild(q);});
  };
  const note=el('div','fb note');note.hidden=true;
  const say=h=>{note.hidden=false;note.innerHTML=h;scrollTo(note);};
  const message=()=>TEACHER_NAME+', this is '+(nameIn.value.trim()||'[your name]')+(clsIn.value?' from '+clsIn.value:'')+'. I finished all '+TOPICS.length+' topics in the Whole Numbers Study Lab. My completion code is '+(code()||'[code]')+'. ('+date+')';
  const needDetails=()=>{if(!ready()){say('Type your full name and choose your class first.');(nameIn.value.trim()?clsIn:nameIn).focus();return true;}return false;};
  const acts=el('div','badge-actions');p.appendChild(acts);
  const row=el('div','btns');row.style.justifyContent='flex-start';acts.appendChild(row);
  let submit=null;
  if(open&&FORM_URL){
    submit=el('a','btn primary','Submit my ticket');submit.target='_blank';submit.rel='noopener';submit.href=FORM_URL;row.appendChild(submit);
    submit.addEventListener('click',e=>{if(needDetails()){e.preventDefault();return;}submit.href=formLink(nameIn.value.trim(),clsIn.value,code());
      say('The form should open in a new tab with your details filled in. Press <b>Submit</b> on the form. When you see <b>"Your response has been recorded"</b>, you are done.<p>If the form did not open, or you did not see that message, use one of the backup ways below.</p>');});
  }
  if(open&&!inFrame){
    const share=el('button','btn secondary','Share or save my ticket');row.appendChild(share);
    share.onclick=async()=>{
      if(needDetails())return;
      try{
        const lines=['Completion code: '+code()].concat(scoreLines());
        const blob=await badgeImage(nameIn.value.trim(),clsIn.value,date,{title:'Completed all '+TOPICS.length+' topics',lines});
        const file=new File([blob],'study-lab-ticket.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Study Lab ticket',text:message()});return;}
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='study-lab-ticket.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
        say('Your ticket picture has been saved. You can send it to '+TEACHER_NAME+'.');
      }catch(e){if(e&&e.name==='AbortError')return;say('That did not work on this phone. Take a screenshot of the ticket instead.');}
    };
  }
  if(open){
    const copy=el('button','btn secondary','Copy my code and message');row.appendChild(copy);
    copy.onclick=async()=>{
      if(needDetails())return;const t=message();
      try{await navigator.clipboard.writeText(t);say('Copied. Paste it into a WhatsApp message or an email to '+TEACHER_NAME+'.');}
      catch(e){say('Copy this message and send it to '+TEACHER_NAME+':');const ta=el('textarea','copybox');ta.id='copybox'+(++uid);ta.readOnly=true;ta.value=t;note.appendChild(ta);ta.focus();ta.select();}
    };
    acts.appendChild(note);
    if(!FORM_URL)acts.appendChild(el('p','small',TEACHER_NAME+' will tell you how to hand in your ticket. Until then, use one of the ways below.'));
    const mail=el('p','email-line');acts.appendChild(mail);
    const updateMail=()=>{mail.innerHTML='Email: <span class="addr">'+TEACHER_EMAIL+'</span> · <a target="_blank" rel="noopener" href="mailto:'+TEACHER_EMAIL+'?subject='+encodeURIComponent('Study Lab ticket: '+(nameIn.value.trim()||'Form 1'))+'&body='+encodeURIComponent(message())+'">Open an email</a>';};
    updateMail();
    const bk=el('div','backup','<b>If the form does not work, do any one of these:</b><ol><li>Press "Copy my code and message", then send it to '+TEACHER_NAME+' on WhatsApp or by email.</li><li>Write your completion code in your exercise book and show '+TEACHER_NAME+' in class.</li><li>Take a screenshot of your ticket and send it.</li></ol><p class="small">Your code only works with your own name and class, so giving it to someone else will not help them.</p>');
    acts.appendChild(bk);
    const save=()=>{store.set('name',nameIn.value.trim());store.set('class',clsIn.value);draw();updateMail();};
    nameIn.addEventListener('input',save);clsIn.addEventListener('change',save);
  }else{
    nameIn.addEventListener('input',draw);clsIn.addEventListener('change',draw);
  }
  draw();window.scrollTo(0,0);
}

/* The badge: a picture the student can share or screenshot, and a message they can copy. */
function badgePanel(info){
  const p=el('section','badge-panel');
  p.appendChild(el('h2',null,'Send '+TEACHER_NAME+' your badge'));
  p.appendChild(el('p','small','This is up to you. Type your name and class, and the badge will show them.'));
  const f=el('div','fields','<div class="field"><label for="badge-name">Your name</label><input id="badge-name" type="text" autocomplete="name" placeholder="First and last name"></div><div class="field"><label for="badge-class">Class</label><select id="badge-class"><option value="">Choose</option>'+CLASSES.map(c=>'<option>'+c+'</option>').join('')+'</select></div>');
  p.appendChild(f);
  const nameIn=f.querySelector('#badge-name'),clsIn=f.querySelector('#badge-class');
  nameIn.value=store.get('name')||'';clsIn.value=store.get('class')||'';
  const badge=el('div','badge');p.appendChild(badge);
  const date=today();
  const draw=()=>{const nm=nameIn.value.trim()||'Your name';const cl=clsIn.value;
    badge.innerHTML='<div class="badge-top"><b>Whole Numbers <span>Study Lab</span></b><small>Form 1 Mathematics · Quiz 1 revision</small></div>'+
      '<div class="badge-body"><div class="seal" aria-hidden="true">✓</div><div><p class="b-name"></p><p class="b-meta"></p><p class="b-title"></p><div class="b-lines"></div></div></div>';
    badge.querySelector('.b-name').textContent=nm;badge.querySelector('.b-meta').textContent=(cl?cl+' · ':'')+date;
    badge.querySelector('.b-title').textContent=info.title;
    const bl=badge.querySelector('.b-lines');info.lines.forEach(l=>{const q=document.createElement('p');q.textContent=l;bl.appendChild(q);});};
  const save=()=>{store.set('name',nameIn.value.trim());store.set('class',clsIn.value);draw();updateMail();};
  nameIn.addEventListener('input',save);clsIn.addEventListener('change',save);
  const acts=el('div','badge-actions');p.appendChild(acts);
  const note=el('div','fb note');note.hidden=true;
  const message=()=>TEACHER_NAME+', this is '+(nameIn.value.trim()||'[your name]')+(clsIn.value?' from '+clsIn.value:'')+'. In the Whole Numbers Study Lab I finished: '+info.msgTopic+'. ('+date+')';
  const needName=()=>{if(!nameIn.value.trim()){note.hidden=false;note.innerHTML='Type your name first, so '+TEACHER_NAME+' knows who it is from.';nameIn.focus();return true;}return false;};
  const row=el('div','btns');row.style.justifyContent='flex-start';acts.appendChild(row);
  if(!inFrame){
    const share=el('button','btn primary','Share or save my badge');row.appendChild(share);
    share.onclick=async()=>{
      if(needName())return;note.hidden=true;
      try{
        const blob=await badgeImage(nameIn.value.trim(),clsIn.value,date,info);
        const file=new File([blob],'study-lab-badge.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Study Lab badge',text:message()});return;}
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='study-lab-badge.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
        note.hidden=false;note.innerHTML='Your badge picture has been saved. You can send it to '+TEACHER_NAME+'.';
      }catch(e){if(e&&e.name==='AbortError')return;note.hidden=false;note.innerHTML='That did not work on this phone. Take a screenshot of the badge instead and send that.';}
    };
  }
  const copy=el('button','btn secondary','Copy a message for '+TEACHER_NAME);row.appendChild(copy);
  copy.onclick=async()=>{
    if(needName())return;const t=message();
    try{await navigator.clipboard.writeText(t);note.hidden=false;note.innerHTML='Copied. You can paste it into a message or an email to '+TEACHER_NAME+'.';}
    catch(e){note.hidden=false;note.innerHTML='Copy this message and send it to '+TEACHER_NAME+':';const ta=el('textarea','copybox');ta.id='copybox'+(++uid);ta.readOnly=true;ta.value=t;note.appendChild(ta);ta.focus();ta.select();}
  };
  const mail=el('p','email-line');acts.appendChild(mail);
  const updateMail=()=>{mail.innerHTML='Email: <span class="addr">'+TEACHER_EMAIL+'</span> · <a target="_blank" rel="noopener" href="mailto:'+TEACHER_EMAIL+'?subject='+encodeURIComponent('Study Lab badge: '+(nameIn.value.trim()||'Form 1'))+'&body='+encodeURIComponent(message())+'">Open an email</a>';};
  acts.appendChild(note);
  acts.appendChild(el('p','small','You can also take a screenshot of the badge and send the picture.'));
  draw();updateMail();
  return p;
}
function badgeImage(name,cls,date,info){
  return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>new Promise((res,rej)=>{
    const W=1000,lineH=44,H=470+Math.max(0,info.lines.length-1)*lineH;
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#F2F6F8';x.fillRect(0,0,W,H);
    x.fillStyle='#0C3B52';x.fillRect(0,0,W,150);
    x.fillStyle='#F4FAFC';x.font='800 50px "Bricolage Grotesque", sans-serif';x.fillText('Whole Numbers ',48,78);
    const w1=x.measureText('Whole Numbers ').width;x.fillStyle='#F0A020';x.fillText('Study Lab',48+w1,78);
    x.fillStyle='#A8C8D6';x.font='500 24px Lexend, sans-serif';x.fillText('Form 1 Mathematics · Quiz 1 revision · '+TEACHER_NAME,48,118);
    x.fillStyle='#F0A020';x.beginPath();x.arc(140,290,78,0,Math.PI*2);x.fill();
    x.strokeStyle='#F0A020';x.lineWidth=5;x.beginPath();x.arc(140,290,92,0,Math.PI*2);x.stroke();
    x.strokeStyle='#2A1A00';x.lineWidth=16;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(104,292);x.lineTo(130,320);x.lineTo(180,260);x.stroke();
    let y=225;x.textBaseline='alphabetic';
    x.fillStyle='#152A38';x.font='800 46px "Bricolage Grotesque", sans-serif';x.fillText(name,268,y);y+=40;
    x.fillStyle='#526676';x.font='400 26px Lexend, sans-serif';x.fillText((cls?cls+' · ':'')+date,268,y);y+=52;
    x.fillStyle='#152A38';x.font='600 30px Lexend, sans-serif';x.fillText(info.title,268,y);y+=46;
    x.font='400 26px Lexend, sans-serif';info.lines.forEach(l=>{x.fillText(l,268,y);y+=lineH;});
    x.fillStyle='#526676';x.font='italic 400 22px Lexend, sans-serif';x.fillText('Nous ne sommes pas impuissants.',48,H-30);
    c.toBlob(b=>b?res(b):rej(new Error('no image')),'image/png');
  }));
}

/* ---------- teacher view: every topic, sample questions with answers and feedback, no playing needed ---------- */
function staticStep(st){
  const w=el('div','t-step');
  if(st.type==='tree'){const T=autoTree(st.n);const ps=treeLeaves(T).sort((a,b)=>a-b);
    w.innerHTML='<p class="step-q">Student builds a factor tree by tapping and splitting. One correct tree:</p>'+treeHTML(T)+'<div class="ans"><b>Answer:</b> '+st.n+' = '+ps.join(' × ')+' &nbsp;('+indexForm(ps)+')</div><p class="small">Any first split is accepted. Splitting into 1 × n, or a pair that does not multiply to the number, is rejected with feedback.</p>';return w;}
  if(st.label)w.appendChild(el('p','step-q',st.label));
  if(st.type==='input')w.appendChild(el('div','ans','<b>Answer:</b> '+(st.answerText||fmt(st.answer))+(st.check&&!st.list?' <span class="small">(any correct answer is accepted)</span>':'')));
  if(st.type==='choice')st.options.forEach(o=>w.appendChild(el('div','opt'+(o.correct?' ok':''),(o.correct?'✓ ':'✗ ')+o.text+(o.why&&!o.correct?'<span class="why">Feedback if chosen: '+o.why+'</span>':''))));
  if(st.type==='multi'){w.appendChild(el('div','ans','<b>Correct tiles:</b> '+st.tiles.filter(t=>t.correct).map(t=>t.v).join(', ')));
    const wrongs=st.tiles.filter(t=>!t.correct);if(wrongs.length)w.appendChild(el('div','explain','<p class="small">Distractors and their feedback:</p><ul>'+wrongs.map(t=>'<li>'+t.whyWrong+'</li>').join('')+'</ul>'));}
  if(st.type==='circle'){const common=st.rows[0].vals.filter(v=>st.rows.every(r=>r.vals.includes(v)));
    w.appendChild(el('div','explain',st.rows.map(r=>listLine(r.label+':',r.vals,common)).join('')));
    w.appendChild(el('div','ans','<b>Circle:</b> '+common.join(', ')));}
  if(st.explain)w.appendChild(el('div','explain','<p class="small">Explanation shown to the student:</p>'+st.explain));
  return w;
}
function staticQ(q,tag){
  const c=el('div','t-q');c.appendChild(el('p','tag',tag));c.appendChild(el('div','prompt',q.prompt));
  q.steps.forEach(st=>c.appendChild(staticStep(st)));return c;
}
function ticketChecker(){
  const w=el('section','teacher-bar');
  w.innerHTML='<h2>Check tickets</h2><p>Tickets '+(ticketsOpen()?'close':'closed')+' at '+TICKET_CLOSES_TEXT+'. A code is valid only for the name and class it was made with. Capital letters, spaces and dashes do not matter.</p>'+
   (FORM_URL?'<p><a class="btn secondary" id="t-test" target="_blank" rel="noopener" href="#">Send a test ticket to the Form</a></p><p class="small">This opens the Form filled in with a test student, the way a real ticket would. Submit it, check it arrives in your responses, then delete it.</p>':'<p class="small">The Google Form is not connected yet, so students will use the backup ways for now.</p>')+
   '<p><b>Check one ticket</b> (for example, a code a student showed you)</p>'+
   '<div class="fields"><div class="field"><label for="t-name">Student name</label><input id="t-name" type="text"></div><div class="field"><label for="t-class">Class</label><select id="t-class">'+CLASSES.map(c=>'<option>'+c+'</option>').join('')+'</select></div></div>'+
   '<div class="answer-row"><input id="t-code" type="text" placeholder="Code, e.g. ABC-234" aria-label="Completion code"><button class="btn primary" id="t-check">Check</button></div><div id="t-res" class="fb note" hidden></div>'+
   '<p><b>Check many at once</b></p><p class="small">Open the Form responses in Google Sheets. Select the rows from the Timestamp column across to the Completion code column, copy, and paste them here. You can also type rows yourself: name, class and code, one student per line, with commas between.</p>'+
   '<textarea class="bulk" id="t-bulk" placeholder="21/10/2026 19:02:11	Kezia Mohammed	1B	ABC-234"></textarea><div class="btns" style="justify-content:flex-start"><button class="btn primary" id="t-bulk-go">Check all</button></div><div id="t-bulk-res"></div>';
  const $=id=>w.querySelector('#'+id);
  if($('t-test')){const tn='TEST Mr Legall';const q=['usp=pp_url'];const add=(k,v)=>{if(k)q.push(encodeURIComponent(k)+'='+encodeURIComponent(v));};add(FORM_FIELDS.name,tn);add(FORM_FIELDS.cls,'1A');add(FORM_FIELDS.code,ticketCode(tn,'1A'));add(FORM_FIELDS.topics,'Test ticket from the teacher view');$('t-test').href=FORM_URL+'?'+q.join('&');}
  $('t-check').onclick=()=>{const r=checkTicket($('t-name').value,$('t-class').value,$('t-code').value);const box=$('t-res');box.hidden=false;
    box.className='fb '+(r.ok?'good':'bad');box.innerHTML=r.ok?'<b>Valid.</b>'+(r.classMismatch?' The code was made for class '+r.cls+', not the class chosen here.':'')+(ticketsOpen()?'':' Note: tickets have closed.'):'<b>Not valid.</b> Check the spelling of the name and the class. The name must match what the student typed on their ticket.';};
  $('t-bulk-go').onclick=()=>{
    const out=$('t-bulk-res');out.innerHTML='';
    const lines=$('t-bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const rows=[];const seen={};const counts={};CLASSES.forEach(c=>counts[c]=0);
    lines.forEach(l=>{
      let cells=l.includes('\t')?l.split('\t'):l.split(',');cells=cells.map(c=>c.trim());
      if(/timestamp|full name|completion code/i.test(l))return;
      let stamp=null;if(cells.length>=4&&parseStamp(cells[0])){stamp=parseStamp(cells[0]);cells=cells.slice(1);}
      const [name,cls,code]=cells;if(!name)return;
      const r=checkTicket(name,cls,code);const late=stamp&&stamp.getTime()>=TICKET_CLOSES.getTime();
      const key=normName(name)+'|'+(r.cls||cls);
      if(r.ok&&!late&&!seen[key]){seen[key]=1;if(counts[r.cls]!==undefined)counts[r.cls]++;}
      rows.push({name,cls:cls||'',code:code||'',ok:r.ok,mis:r.classMismatch?r.cls:'',late,dup:r.ok&&seen[key]&&rows.some(x=>x.ok&&normName(x.name)===normName(name))});
    });
    if(!rows.length){out.appendChild(el('p','small','No rows found. Paste rows with a name, a class and a code.'));return;}
    out.appendChild(el('p','chk-sum','Valid tickets on time: '+CLASSES.map(c=>c+': '+counts[c]).join(' · ')));
    const wrap=el('div','chk-wrap');const t=el('table','chk-table');t.innerHTML='<thead><tr><th>Name</th><th>Class</th><th>Code</th><th>Result</th></tr></thead>';const tb=document.createElement('tbody');
    rows.forEach(r=>{const tr=document.createElement('tr');[r.name,r.cls,r.code].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
      const td=document.createElement('td');td.className=r.ok&&!r.late?'ok':'no';
      td.textContent=r.ok?('Valid'+(r.mis?' (code is for '+r.mis+')':'')+(r.late?', but sent after the deadline':'')+(r.dup?' · repeat':'')):'Not valid';tr.appendChild(td);tb.appendChild(tr);});
    t.appendChild(tb);wrap.appendChild(t);out.appendChild(wrap);
  };
  return w;
}
function teacherView(){
  S=null;app.innerHTML='';const col=el('div','col gutter');app.appendChild(col);
  const bar=el('section','teacher-bar','<h2>Teacher view</h2><p>Every topic with its worked examples and sample questions, showing the answers and the feedback a student would see. Numbers are random, so press "New samples" to see more.</p>');
  const btns=el('div','btns');btns.style.justifyContent='flex-start';
  const more=el('button','btn primary','New samples');more.onclick=()=>{teacherView();};
  const out=el('button','btn secondary','Back to student view');out.onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}home();window.scrollTo(0,0);};
  btns.append(more,out);bar.appendChild(btns);
  const chips=el('div','chips');TOPICS.forEach(T=>{const a=el('a','chip',T.name);a.href='#t-'+T.id;a.onclick=e=>{e.preventDefault();const t=document.getElementById('t-'+T.id);if(t)t.scrollIntoView();};chips.appendChild(a);});bar.appendChild(chips);
  col.appendChild(bar);
  col.appendChild(ticketChecker());
  TOPICS.forEach(T=>{
    const sec=el('section','t-topic');sec.id='t-'+T.id;sec.appendChild(el('div','qhead tint'+T.tint,'<span class="ticon sym">'+T.sym+'</span><h2>'+T.name+'</h2>'));
    sec.appendChild(el('details','remind','<summary>"Remind me how this works" (what students see)</summary><div class="remind-body">'+T.remind()+'</div>'));
    if(T.id==='fault')FAULTS.forEach((F,i)=>sec.appendChild(staticQ(faultQ(F),'Item '+(i+1)+' of '+FAULTS.length)));
    else{const gens=[...new Set(T.gens)];gens.forEach((g,i)=>{sec.appendChild(staticQ(g(),'Sample '+(i+1)));});
      if(T.id==='hcf')sec.appendChild(el('p','small','The HCF/LCM word problems use a bank of '+SCEN.length+' scenarios.'));}
    col.appendChild(sec);
  });
  window.scrollTo(0,0);
}

if(app){
  let taps=[];
  const title=document.getElementById('title');
  if(title)title.addEventListener('click',()=>{const now=Date.now();taps=taps.filter(t=>now-t<3000);taps.push(now);if(taps.length>=5){taps=[];teacherView();}});
  if(location.hash==='#teacher')teacherView();else home();
  window.addEventListener('hashchange',()=>{if(location.hash==='#teacher')teacherView();});
}
